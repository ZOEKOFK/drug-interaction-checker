[project]
name = "saferx-backend"
version = "0.1.0"
description = "SafeRx 用药安全卫士 - FastAPI 后端（药物相互作用检查）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

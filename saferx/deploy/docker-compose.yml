# SafeRx 容器化部署（可选；本地演示用 make start / make prod 即可）
# 用法：cd saferx && docker compose -f deploy/docker-compose.yml up --build
services:
  saferx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SAFERX_DB=/app/data/saferx.sqlite
    volumes:
      # 数据库与原始数据持久化（容器重建无需重新下载）
      - saferx-data:/app/data
    restart: unless-stopped

volumes:
  saferx-data:

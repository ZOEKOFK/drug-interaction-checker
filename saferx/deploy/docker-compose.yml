# SafeRx 容器化部署（可选；本地演示用 make start / make prod 即可）
# 用法：cd saferx && docker compose -f deploy/docker-compose.yml up --build
services:
  saferx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: saferx:latest
    ports:
      - "8000:8000"
    environment:
      - SAFERX_DB=/app/data/saferx.sqlite
    volumes:
      # 只持久化「原始 CSV 缓存」。不要挂 /app/data —— 命名卷首次挂载是空目录，
      # 会把镜像自带的 saferx.sqlite 遮蔽掉，容器于是又要联网重下 500MB CSV。
      - saferx-raw:/app/data/raw
    restart: unless-stopped

volumes:
  saferx-raw:
